[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/get-started/introduction/"
  status = 301
  force = true

# Renamed page: /guides/frontmatter/ -> /guides/frontmatter-properties/
# (Astro calls them "frontmatter", Obsidian calls them "properties"; the title is the compromise.)
[[redirects]]
  from = "/guides/frontmatter"
  to = "/guides/frontmatter-properties/"
  status = 301

[[redirects]]
  from = "/guides/frontmatter/"
  to = "/guides/frontmatter-properties/"
  status = 301

# Settings Search plugin removed: Obsidian 1.13 ships a built-in global settings search.
[[redirects]]
  from = "/plugins/settings-search"
  to = "/get-started/introduction/"
  status = 301

[[redirects]]
  from = "/plugins/settings-search/"
  to = "/get-started/introduction/"
  status = 301

# The docs were reorganized so every sidebar group maps to a real folder.
